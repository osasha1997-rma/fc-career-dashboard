<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerOS</title>

    <meta name="theme-color" content="#0F172A">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/matchCentre.css?v=8">
    <link rel="stylesheet" href="css/competitions.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/analytics.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader">
            <h1>⚽ CareerOS</h1>
            <p>Loading Career...</p>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="hidden">

        <!-- Header -->
        <header id="header"></header>

        <!-- Screen Container -->
        <main id="screen-container"></main>

        <!-- Bottom Navigation -->
        <nav id="bottom-nav">

            <button class="nav-btn active" data-screen="dashboard">
                <span>🏠</span>
                <small>Home</small>
            </button>

            <button class="nav-btn" data-screen="squad">
                <span>👥</span>
                <small>Squad</small>
            </button>

            <button class="nav-btn" data-screen="matches">
                <span>📅</span>
                <small>Match Centre</small>
            </button>

            <button class="nav-btn" data-screen="analytics">
                <span>📈</span>
                <small>Analytics</small>
            </button>

            <button class="nav-btn" data-screen="competitions">
                <span>🏆</span>
                <small>Competitions</small>
            </button>

            <button class="nav-btn" data-screen="calendar">
                <span>🗓️</span>
                <small>Calendar</small>
            </button>

        </nav>

    </div>

    <script type="module" src="js/app.js?v=2"></script>

</body>
</html>
